function reportSlices(payload){
  var raw=new TextEncoder().encode(payload);
  var limit=3200;
  var id=(tag||'detect')+'-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36);
  if(raw.length<=limit) return [{id:id, index:0, count:1, body:raw}];
  var n=Math.ceil(raw.length/limit);
  var slices=[];
  for(var i=0;i<n;i++){
    var head=new TextEncoder().encode('P '+id+' '+i+' '+n+' '+raw.length+'\n');
    var slice=raw.subarray(i*limit,Math.min(raw.length,(i+1)*limit));
    var body=new Uint8Array(head.length+slice.length);
    body.set(head,0); body.set(slice,head.length);
    slices.push({id:id, index:i, count:n, body:body});
  }
  return slices;
}
