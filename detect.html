/* ---- G6Y：定位完整性扫描 ---- */
function oneFix(timeout){
  return new Promise(function(resolve){
    var t0=now();
    if(!navigator.geolocation){ resolve({ok:false,ms:0,code:'no-geo'}); return; }
    var settled=false;
    var fin=function(r){ if(settled) return; settled=true; resolve(r); };
    setTimeout(function(){ fin({ok:false,ms:now()-t0,code:'timeout'}); },timeout+50);
    try{
      navigator.geolocation.getCurrentPosition(function(p){
        fin({ok:true,ms:now()-t0,timestamp:p.timestamp,
             lat:r4(p.coords.latitude),lon:r4(p.coords.longitude),
             acc:r4(p.coords.accuracy),alt:r4(p.coords.altitude),
             altAcc:r4(p.coords.altitudeAccuracy),heading:r4(p.coords.heading),
             speed:r4(p.coords.speed),
             keys:Object.keys(p.coords).join(','),
             altitude_null:p.coords.altitude===null,
             has_toJSON:typeof p.coords.toJSON==='function'});
      },function(e){ fin({ok:false,ms:now()-t0,code:e.code,msg:e.message}); },
      {enableHighAccuracy:true,maximumAge:0,timeout:timeout});
    }catch(e){ fin({ok:false,ms:now()-t0,code:'throw'}); }
  });
}
/* T3q：25 次串行 getCurrentPosition（timeout 10ms、高精度、maximumAge 0）
   判定：>=80% 在 10ms 内返回 且 无拒绝/超时 且 25 个 timestamp 全同 → spoofed */
function oneScan(){
  return new Promise(function(resolve){
    var t0=now();
    if(!navigator.geolocation){ resolve({ms:0}); return; }
    var settled=false;
    var fin=function(r){ if(settled) return; settled=true; resolve(r); };
    setTimeout(function(){ fin({ms:now()-t0,isTimeout:true}); },200);
    try{
      navigator.geolocation.getCurrentPosition(function(p){
        fin({ms:now()-t0,coords:p.coords,timestamp:p.timestamp,
             lat:r4(p.coords.latitude),lon:r4(p.coords.longitude),acc:r4(p.coords.accuracy),
             alt:r4(p.coords.altitude),altAcc:r4(p.coords.altitudeAccuracy),
             heading:r4(p.coords.heading),speed:r4(p.coords.speed),
             keys:Object.keys(p.coords).join(','),altitude_null:p.coords.altitude===null});
      },function(e){ fin({ms:now()-t0,isDenied:e.code===e.PERMISSION_DENIED,isTimeout:e.code===e.TIMEOUT,code:e.code}); },
      {enableHighAccuracy:true,timeout:10,maximumAge:0});
    }catch(e){ fin({ms:now()-t0,code:'throw'}); }
  });
}
async function geoScan(count,timeout){
  count=count||25;
  var scans=[], firstTs=null, sameTs=0, denied=0, timeouts=0, coordsOk=0, sample=null, series=[];
  for(var i=0;i<count;i++){
    var r=await oneScan();
    scans.push(Math.round(r.ms));
    if(r.coords){
      if(!sample) sample=r;
      coordsOk++;
      series.push({acc:r.acc,alt:r.alt,altAcc:r.altAcc,lat:r.lat,lon:r.lon,ts:r.timestamp});
      if(firstTs!==null && r.timestamp===firstTs) sameTs++;
      firstTs=r.timestamp;
    } else if(r.isDenied) denied++;
    else if(r.isTimeout) timeouts++;
  }
  var fastRatio=scans.filter(function(ms){return ms<10;}).length/count;
  var spoofed=(fastRatio>0.8 && denied===0 && timeouts===0 && sameTs===count-1)?1:0;
  return {count:count,same_timestamp_count:sameTs,timeout_count:timeouts,denied_count:denied,
          coords_count:coordsOk,fast_ratio:r4(fastRatio),instant_success_count:scans.filter(function(ms){return ms<=1;}).length,
          scanning:scans.join(','),spoofed:spoofed,sample:sample,series:series};
}

/* ---- 定位漂移序列：与真机对比逐次精度变化（宽松超时，非 SDK 的 10ms 扫描） ---- */
async function geoDrift(count){
  var out=[];
  for(var i=0;i<count;i++){
    var r = await new Promise(function(resolve){
      var settled=false, t0=now();
      var fin=function(v){ if(settled) return; settled=true; resolve(v); };
      setTimeout(function(){ fin({ok:false,ms:Math.round(now()-t0),reason:'timeout'}); }, 4000);
      try{
        navigator.geolocation.getCurrentPosition(function(p){
          fin({ok:true,ms:Math.round(now()-t0),acc:r4(p.coords.accuracy),alt:r4(p.coords.altitude),
               altAcc:r4(p.coords.altitudeAccuracy),lat:r4(p.coords.latitude),lon:r4(p.coords.longitude),
               ts:p.timestamp});
        },function(e){ fin({ok:false,ms:Math.round(now()-t0),reason:'code='+e.code}); },
        {enableHighAccuracy:true,maximumAge:0,timeout:4000});
      }catch(e){ fin({ok:false,ms:0,reason:'throw'}); }
    });
    out.push(r);
    await new Promise(function(r){ setTimeout(r, 700); });
  }
  return out;
}

var IDENT=new Set(['ssn','national_id','dob','date_of_birth','last_name','surname','first_name','full_name','name','address','passport','license']);

  var k=elKeys.get(el); if(k===undefined){ k='el#'+(elSeq++); elKeys.set(el,k); } return k;
}
function roleOf(el){
  try{
    var ac=(el.getAttribute('autocomplete')||'').toLowerCase();
    var direct={username:'name',email:'email',tel:'phone','current-password':'other','new-password':'other'};
    if(ac&&direct[ac]) return direct[ac];

             (el.getAttribute('placeholder')||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();
    if(/passport/.test(hay)) return 'passport';
    if(/national.?id|id.?number/.test(hay)) return 'national_id';
    if(/\bssn|social/.test(hay)) return 'ssn';
    if(/date.?of.?birth|\bdob\b/.test(hay)) return 'date_of_birth';
    if(/last.?name|surname/.test(hay)) return 'last_name';
    if(/first.?name|given/.test(hay)) return 'first_name';
    if(/full.?name/.test(hay)) return 'full_name';
    if(/address/.test(hay)) return 'address';
    if(/user.?name|nick.?name|display.?name|screen.?name/.test(hay)) return 'name';
    if(/mail/.test(hay)) return 'email';
    if(/phone|mobile|tel/.test(hay)) return 'phone';
    var t=(el.getAttribute('type')||'').toLowerCase();

function fieldOf(el){

function targetOf(e){

  return e.target;
}
['paste','keydown','input','pointermove','animationstart'].forEach(function(type){
  document.addEventListener(type,function(e){
    var el=targetOf(e); if(!el||!('tagName' in el)) return;
    var f=fieldOf(el);
    if(type==='paste'){ f.pasted=true; FORM.formEndTs=now(); }
    else if(type==='keydown'){ f.keystrokes++; if(e.key==='Backspace'){ f.backspaces++; f.reEdits++; } FORM.formEndTs=now(); }
    else if(type==='input'){
      var len=typeof el.value==='string'?el.value.length:0, delta=len-(f.prevLen||0); f.prevLen=len;
      if(!e.isComposing&&!f.pasted&&(delta>=2||e.inputType==='insertReplacementText')) f.autofilled=true;

(function autofillStyle(){

      'input:-webkit-autofill,textarea:-webkit-autofill,select:-webkit-autofill,input:autofill,textarea:autofill,select:autofill{animation-name:signals-bx-autofill;animation-duration:1ms}';

function behaviorSignals(){
  var fields=Object.keys(FORM.fields).map(function(k){return FORM.fields[k];});
  var pastedFields=fields.filter(function(f){return f.pasted&&IDENT.has(f.role);}).map(function(f){return f.role;});
  var pasteIntoIdentity=pastedFields.length>0;
  var reEdits=fields.reduce(function(a,f){return a+f.reEdits;},0);
  var autofillUsed=fields.some(function(f){return f.autofilled;});
  var ms=Math.max(0,FORM.formEndTs-FORM.formStartTs);
  var identCount=fields.filter(function(f){return IDENT.has(f.role);}).length;
  var suspected=FORM.automationHints.webdriver||FORM.automationHints.headless||
    (!FORM.pointerMoved&&identCount>0&&ms>0&&ms<1200);
  var score=1;
  if(pasteIntoIdentity) score-=0.5;
  if(suspected) score-=0.5;
  if(!FORM.pointerMoved) score-=0.2;
  if(FORM.focusSwitches>2) score-=0.2;
  if(reEdits>5) score-=0.1;
  if(identCount>0&&ms>0&&ms<1500) score-=0.3;
  score=Math.max(0,Math.min(1,score));
  return {
    behavior_paste_into_identity:pasteIntoIdentity,
    behavior_paste_fields:pastedFields,
    behavior_typing_familiarity:Number(score.toFixed(2)),
    behavior_form_completion_ms:ms,
    behavior_pointer_motion_present:FORM.pointerMoved,
    behavior_focus_switch_count:FORM.focusSwitches,
    behavior_autofill_used:autofillUsed,
    behavior_automation_suspected:suspected,
    behavior_re_edit_count:reEdits,
    behavior_iframe_blocked:Boolean(FORM.iframeBlocked),
    fields:fields.map(function(f){return {role:f.role,keystrokes:f.keystrokes,backspaces:f.backspaces,pasted:f.pasted,autofilled:f.autofilled};})
  };
}
