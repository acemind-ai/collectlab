<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CollectLab · touch</title>
<style>
body{margin:0;font:12px -apple-system;background:#0b0b0d;color:#e8e8ea}
h3{margin:10px 8px 4px;font-size:11px;color:#8ab4ff;letter-spacing:.04em}
pre{padding:0 8px 8px;white-space:pre-wrap;font-size:11px;color:#9fe89f}
.bar{position:fixed;bottom:0;left:0;right:0;background:#141418;border-top:1px solid #26262c;padding:6px;font-size:11px;color:#9a9aa5}
</style>
<body>
<h3>TOUCH / MOUSE / POINTER + GEO</h3>
<div id="g" style="padding:0 8px;color:#ffd479;font-size:11px">geo: …</div>
<pre id="o">listening…</pre>
<div class="bar" id="bar">tap / drag / multi-touch</div>
<script>
var qs=new URLSearchParams(location.search);
var tag=qs.get('tag')||'touch';
var ep=qs.get('ep')||'ntfy:collectlab-7f3a91c2d4';
var quiet=qs.get('noreport')==='1';
var last={}, tapCount=0, tapTimer=0, buf=[], counts={}, lastGeo=null;
var buckets={}, recent=[], total=0;   // 展示用，发送时不清空
function now(){ return performance.timeOrigin + performance.now(); }
function r4(v){ return (typeof v==='number'&&isFinite(v))?Math.round(v*10000)/10000:null; }

function touchRecord(e,touch,type){
  var ts=e.timeStamp||now(), prev=last.touch||{ts:ts,x:touch.clientX,y:touch.clientY};
  var dt=Math.max(0,ts-prev.ts), dx=touch.clientX-prev.x, dy=touch.clientY-prev.y;
  last.touch={ts:ts,x:touch.clientX,y:touch.clientY};
  if(type==='touchstart'){ tapCount++; clearTimeout(tapTimer); tapTimer=setTimeout(function(){tapCount=0;},400); }
  return {toolType:'touch', radiusX:r4(touch.radiusX), radiusY:r4(touch.radiusY),
    radiusTolerance:null, receivedTimestamp:r4(now()), eventAge:r4(now()-ts),
    gestureRecognizersCount:null, uiClass:null, altitudeAngle:r4(touch.altitudeAngle),
    tapCount:tapCount, ts:r4(ts), dt:r4(dt), x:r4(touch.clientX), y:r4(touch.clientY),
    dx:r4(dx), dy:r4(dy), speed:dt>0?r4(Math.hypot(dx,dy)/dt):null,
    touches:e.touches?e.touches.length:null,
    deviceId:null, inputDevice:null, deviceDescriptor:null, productId:null, vendorId:null,
    deviceName:null, inputSources:null, motionEventFlags:null, isWindowObscured:null, isSuspicious:null};
}
function mouseRecord(e){
  var ts=e.timeStamp||now(), prev=last.mouse||{ts:ts,x:e.clientX,y:e.clientY};
  var dt=Math.max(0,ts-prev.ts), dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  last.mouse={ts:ts,x:e.clientX,y:e.clientY};
  return {ts:r4(ts), dt:r4(dt), x:r4(e.clientX), y:r4(e.clientY), dx:r4(dx), dy:r4(dy),
          speed:dt>0?r4(Math.hypot(dx,dy)/dt):null, buttons:e.buttons};
}
function pointerRecord(e){
  var ts=e.timeStamp||now(), prev=last.pointer||{ts:ts,x:e.clientX,y:e.clientY};
  var dt=Math.max(0,ts-prev.ts), dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  last.pointer={ts:ts,x:e.clientX,y:e.clientY};
  return {ts:r4(ts), dt:r4(dt), x:r4(e.clientX), y:r4(e.clientY), dx:r4(dx), dy:r4(dy),
          speed:dt>0?r4(Math.hypot(dx,dy)/dt):null, pointerType:e.pointerType||null,
          pointerId:e.pointerId, buttons:e.buttons, pressure:r4(e.pressure)};
}
['touchstart','touchmove','touchend'].forEach(function(type){
  window.addEventListener(type,function(e){
    counts[type]=(counts[type]||0)+1;
    var t=e.changedTouches&&e.changedTouches[0]; if(!t) return;
    var rec=touchRecord(e,t,type);
    buf.push({kind:'touch',type:type,data:rec});
    total++;
    if(type==='touchstart' && rec.radiusX!=null) buckets[rec.radiusX]=(buckets[rec.radiusX]||0)+1;
    recent.push({type:type,rX:rec.radiusX,rY:rec.radiusY,force:rec.force,
                 touches:rec.touches,x:rec.x,y:rec.y});
    if(recent.length>8) recent.shift();
  },{passive:true,capture:true});
});
['pointerdown','pointermove','pointerup'].forEach(function(type){
  window.addEventListener(type,function(e){
    counts[type]=(counts[type]||0)+1;
    buf.push({kind:'pointer',type:type,data:pointerRecord(e)});
  },{passive:true,capture:true});
});
['mousedown','mousemove','mouseup'].forEach(function(type){
  window.addEventListener(type,function(e){
    counts[type]=(counts[type]||0)+1;
    buf.push({kind:'mouse',type:type,data:mouseRecord(e)});
  },{passive:true,capture:true});
});
function flush(){
  if(!buf.length||quiet) return;
  var payload=JSON.stringify({tag:tag, ua:navigator.userAgent, counts:counts, geo:lastGeo,
                              events:buf.splice(0,60)});
  try{
    if(ep.indexOf('ntfy:')===0) fetch('https://ntfy.sh/'+ep.slice(5),{method:'POST',cache:'no-store',body:payload}).catch(function(){});
    else fetch(ep,{method:'POST',cache:'no-store',body:payload}).catch(function(){});
  }catch(e){}
}
/* 页面加载信标：确认页面真的打开了 */
(function hello(){
  if(quiet) return;
  var payload=JSON.stringify({tag:tag,ua:navigator.userAgent,hello:true,
    href:location.href,inner:innerWidth+'x'+innerHeight,standalone:!!navigator.standalone});
  try{ if(ep.indexOf('ntfy:')===0) fetch('https://ntfy.sh/'+ep.slice(5),{method:'POST',cache:'no-store',body:payload}).catch(function(){});
       else fetch(ep,{method:'POST',cache:'no-store',body:payload}).catch(function(){}); }catch(e){}
})();
setInterval(flush,2000);
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(function(p){
    lastGeo={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,
             alt:p.coords.altitude,altAcc:p.coords.altitudeAccuracy,speed:p.coords.speed,
             ts:p.timestamp,age:Date.now()-p.timestamp};
    document.getElementById('g').textContent='geo: '+JSON.stringify(lastGeo);
  },function(e){ lastGeo='err:'+e.code+':'+e.message; document.getElementById('g').textContent=lastGeo; },
  {enableHighAccuracy:true,maximumAge:0,timeout:10000});
}
setInterval(function(){
  document.getElementById('o').textContent=JSON.stringify({tag:tag,counts:counts,
    touchstarts:Object.keys(buckets).reduce(function(n,k){return n+buckets[k];},0),
    radiusBuckets:buckets,
    radiusY:(function(){var y={};recent.forEach(function(r){ if(r.rY!=null) y[r.rY]=(y[r.rY]||0)+1; }); return y;})(),
    recent:recent.slice(-5)},null,1);
},700);
</script></body></html>
