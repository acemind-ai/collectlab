<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CollectLab</title>
<style>
body{margin:0;font:13px -apple-system,system-ui;background:#0b0b0d;color:#e8e8ea}
header{position:sticky;top:0;background:#141418;padding:8px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #26262c;align-items:center}
.brand{font-weight:600;margin-right:8px}
button{font:12px -apple-system;padding:6px 10px;border-radius:6px;border:1px solid #333;background:#1d1d23;color:#e8e8ea}
h3{margin:14px 8px 4px;font-size:12px;color:#8ab4ff;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
td{padding:3px 8px;vertical-align:top;border-bottom:1px solid #1c1c22;word-break:break-all}
td.k{color:#9a9aa5;width:38%}
td.v{color:#d6f5d6}
.bar{position:fixed;bottom:0;left:0;right:0;background:#141418;border-top:1px solid #26262c;padding:6px;font-size:11px;color:#9a9aa5}
</style>
<body>
<header><span class="brand">CollectLab</span>
  <button id="b1">Copy JSON</button>
  <button id="b2">Download</button>
  <button id="b3">Raw</button>
  <button id="b4">Reload</button>
</header>
<div id="view"><pre id="o" style="white-space:pre-wrap;padding:8px;font-size:11px;color:#9a9aa5">collecting…</pre></div>
<div class="bar" id="bar">collecting — results appear after ~12s</div>
<script src="collect.js"></script>
<script>
var raw = false, last = null;
var GROUPS = [
  ['Environment', /^(standalone|displayMode|inner|outer|screen|avail|dpr|userAgent|platform|lang|languages|tzName|tzOffsetMin|hwConcurrency|maxTouch|deviceMemory|colorGamut|uaCh|plugin|mime|hasWebdriver|isSecureContext|storage|webBrowser|appId|osName|osVersion|safariVersion|readyStateMs)/i],
  ['Fingerprint', /^(fonts|fontPref|canvasFp|webgl|audioFp|visitorId|refreshHz|heapLimit)/i],
  ['Permissions', /^(perm_|mediaDevices|getUserMedia|gumCalls)/i],
  ['Location', /^(geo|location)/i],
  ['Network', /^(stun|exit|ntp|http|localCandidate|conn)/i],
  ['Interaction', /^interaction/i]
];
function groupOf(k){ for (var i=0;i<GROUPS.length;i++) if (GROUPS[i][1].test(k)) return GROUPS[i][0]; return 'Other'; }
function fmt(v){
  if (v === null) return 'null';
  if (typeof v === 'object') { if (Array.isArray(v)) return v.slice(0,10).map(x=>typeof x==='object'?JSON.stringify(x):x).join(', '); return JSON.stringify(v); }
  return String(v);
}
function render(){
  var txt = (document.getElementById('o').textContent || '').trim();
  if (!txt.startsWith('{')) return;
  var obj; try { obj = JSON.parse(txt); } catch(e) { return; }
  last = obj; if (raw) return;
  var buckets = {};
  Object.keys(obj).forEach(function(k){ (buckets[groupOf(k)] = buckets[groupOf(k)] || []).push(k); });
  var html = '';
  ['Environment','Fingerprint','Permissions','Location','Network','Interaction','Other'].forEach(function(g){
    if (!buckets[g]) return;
    html += '<h3>'+g+'</h3><table>';
    buckets[g].forEach(function(k){ html += '<tr><td class="k">'+k+'</td><td class="v">'+fmt(obj[k])+'</td></tr>'; });
    html += '</table>';
  });
  document.getElementById('view').innerHTML = html;
  document.getElementById('bar').textContent = Object.keys(obj).length + ' fields collected';
}
document.getElementById('b1').onclick = function(){
  var t = last ? JSON.stringify(last, null, 1) : document.getElementById('o').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ note('copied'); }); else note('long-press to copy');
};
document.getElementById('b2').onclick = function(){
  var t = last ? JSON.stringify(last, null, 1) : document.getElementById('o').textContent;
  var tag = new URLSearchParams(location.search).get('tag') || 'collect';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], {type:'application/json'}));
  a.download = tag + '-' + new Date().toISOString().replace(/[:.]/g,'-') + '.json';
  a.click(); note('downloaded');
};
document.getElementById('b3').onclick = function(){ raw = !raw; if (raw) location.reload(); };
document.getElementById('b4').onclick = function(){ location.reload(); };
function note(m){ var b=document.getElementById('bar'); var o=b.textContent; b.textContent=m; setTimeout(function(){b.textContent=o;},1500); }
setInterval(render, 1000);
</script>
</body></html>
