<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CollectLab · profile</title>
<style>
body{margin:0;font:12px -apple-system;background:#0b0b0d;color:#e8e8ea}
header{position:sticky;top:0;background:#141418;border-bottom:1px solid #26262c;padding:8px;font-weight:600}
.row{padding:8px 10px;border-bottom:1px solid #26262c;display:flex;gap:6px;align-items:center}
input{flex:1;padding:6px;border-radius:6px;border:1px solid #333;background:#1d1d23;color:#e8e8ea}
button{padding:6px 10px;border-radius:6px;border:1px solid #333;background:#1d1d23;color:#e8e8ea}
#sum{padding:10px;font-size:12px;line-height:1.7}
#sum b{color:#8ab4ff}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:3px 10px;border-bottom:1px solid #1c1c22}
td.n,td.p{text-align:right;width:70px;color:#9fe89f}
.bar{position:fixed;bottom:0;left:0;right:0;background:#141418;border-top:1px solid #26262c;padding:6px;font-size:11px;color:#9a9aa5}
</style>
<body>
<header>CollectLab · device profile (full fields + radius)</header>
<div class="row"><input id="model" placeholder="机型，如 iPhone 13"><button id="save">save</button></div>
<div id="sum">collecting profile — tap the screen 20+ times</div>
<table id="t"></table>
<pre id="o" style="display:none"></pre>
<div class="bar" id="bar">…</div>
<script src="collect.js"></script>
<script>
var qs = new URLSearchParams(location.search);
var tag = qs.get('tag') || 'profile';
var ep = qs.get('ep') || 'ntfy:collectlab-7f3a91c2d4';
var quiet = qs.get('noreport') === '1';
var model = qs.get('model') || localStorage.getItem('collectlab.model') || '';
var modelInput = document.getElementById('model');
modelInput.value = model;
document.getElementById('save').onclick = function(){ model = modelInput.value.trim();
  try { localStorage.setItem('collectlab.model', model); } catch(e) {} render(); };

var buckets = {}, radiusY = {}, forceMismatch = 0, touchesSeen = {}, tapTimes = [], sentTotal = -1;
var touchLog = [], mouseLog = [], pointerLog = [];
var anchor = {touch:{}, mouse:null, pointer:{}};
var ITEM_LIMIT = 100;
function num(v){ return (typeof v==='number' && isFinite(v)) ? Math.round(v*1e4)/1e4 : null; }
function clock(){ return performance.now(); }
var pending = {touch:[], mouse:[], pointer:[]};
function remember(list, kind, item){
  list.push(item); if (list.length > ITEM_LIMIT) list.shift();
  pending[kind].push(item);
}
function step(prev, ts, x, y){
  if (!prev) return {dt:0, dx:0, dy:0, speed:null, first:true};
  var dt = Math.max(0, ts - prev.ts), dx = x - prev.x, dy = y - prev.y;
  return {dt:dt, dx:dx, dy:dy, speed:dt>0 ? Math.sqrt(dx*dx+dy*dy)/dt : null, first:false};
}
function onTouch(e){
  var ts = clock(), received = typeof e.timeStamp==='number' ? e.timeStamp : ts;
  var age = Math.max(0, ts - received), n = e.touches ? e.touches.length : 0;
  var list = e.changedTouches || [];
  for (var i=0;i<list.length;i++){
    var t = list[i], id = t.identifier, prev = anchor.touch[id];
    var d = step(prev, ts, t.clientX, t.clientY);
    if (!d.first) remember(touchLog, 'touch', {ts:num(ts), dt:num(d.dt), x:num(t.clientX), y:num(t.clientY),
      dx:num(d.dx), dy:num(d.dy), speed:num(d.speed), touches:n, radiusX:num(t.radiusX), radiusY:num(t.radiusY),
      receivedTimestamp:num(received), eventAge:num(age)});
    if (e.type==='touchend' || e.type==='touchcancel') delete anchor.touch[id];
    else anchor.touch[id] = {ts:ts, x:t.clientX, y:t.clientY};
    if (e.type==='touchstart'){
      var k = t.radiusX==null ? 'null' : String(num(t.radiusX));
      buckets[k] = (buckets[k]||0)+1;
      var yk = t.radiusY==null ? 'null' : String(num(t.radiusY));
      radiusY[yk] = (radiusY[yk]||0)+1;
      touchesSeen[n] = (touchesSeen[n]||0)+1;
      if (typeof t.force==='number' && typeof t.radiusX==='number' && Math.abs(t.force-t.radiusX)>1e-6) forceMismatch++;
      tapTimes.push(Date.now()); if (tapTimes.length>60) tapTimes.shift();
    }
  }
  render();
}
function onMouse(e){
  var ts = clock(), d = step(anchor.mouse, ts, e.clientX, e.clientY);
  if (!d.first) remember(mouseLog, 'mouse', {ts:num(ts), dt:num(d.dt), x:num(e.clientX), y:num(e.clientY),
    dx:num(d.dx), dy:num(d.dy), speed:num(d.speed), buttons:e.buttons});
  anchor.mouse = (e.type==='mouseup') ? null : {ts:ts, x:e.clientX, y:e.clientY};
}
function onPointer(e){
  var ts = clock(), id = e.pointerId, prev = anchor.pointer[id];
  var d = step(prev, ts, e.clientX, e.clientY);
  if (!d.first) remember(pointerLog, 'pointer', {ts:num(ts), dt:num(d.dt), x:num(e.clientX), y:num(e.clientY),
    dx:num(d.dx), dy:num(d.dy), speed:num(d.speed), pointerType:e.pointerType||null,
    pointerId:e.pointerId, buttons:e.buttons, pressure:num(e.pressure)});
  if (e.type==='pointerup' || e.type==='pointercancel') delete anchor.pointer[id];
  else anchor.pointer[id] = {ts:ts, x:e.clientX, y:e.clientY};
}
['touchstart','touchmove','touchend','touchcancel'].forEach(function(type){
  window.addEventListener(type, onTouch, {passive:true, capture:true});
});
['mousedown','mousemove','mouseup'].forEach(function(type){
  window.addEventListener(type, onMouse, {passive:true, capture:true});
});
['pointerdown','pointermove','pointerup','pointercancel'].forEach(function(type){
  window.addEventListener(type, onPointer, {passive:true, capture:true});
});

function tapStats(){
  var gaps = [];
  for (var i = 1; i < tapTimes.length; i++) gaps.push(tapTimes[i] - tapTimes[i-1]);
  if (!gaps.length) return null;
  gaps.sort(function(a,b){ return a-b; });
  var pick = function(p){ return gaps[Math.min(gaps.length-1, Math.floor(p*gaps.length))]; };
  return {n: gaps.length, min: gaps[0], p25: pick(.25), p50: pick(.5), p75: pick(.75), max: gaps[gaps.length-1]};
}
function profile(){
  var full = null;
  try { full = JSON.parse((document.getElementById('o').textContent || '').trim()); } catch(e) {}
  return {tag:tag, model:model, ua:navigator.userAgent,
          taps:Object.keys(buckets).reduce(function(n,k){ return n + buckets[k]; }, 0),
          buckets:buckets, radiusY:radiusY, touches:touchesSeen, forceMismatch:forceMismatch,
          tapIntervalMs:tapStats(),
          touch:touchLog.slice(), mouse:mouseLog.slice(), pointer:pointerLog.slice(),
          collected:full};
}
function render(){
  var p = profile();
  var rows = Object.keys(buckets).map(function(k){ return [k, buckets[k]]; })
              .sort(function(a,b){ return b[1]-a[1]; });
  var total = p.taps || 0;
  document.getElementById('sum').innerHTML = 'model <b>' + (model || '—') + '</b>' +
    ' &nbsp; taps <b>' + total + '</b> &nbsp; distinct radiusX <b>' + rows.length + '</b>' +
    ' &nbsp; radiusY <b>' + Object.keys(radiusY).join(',') + '</b>' +
    ' &nbsp; touches <b>' + Object.keys(touchesSeen).join(',') + '</b>' +
    (forceMismatch ? ' &nbsp; force≠radiusX <b>' + forceMismatch + '</b>' : '') +
    ' &nbsp; touch <b>' + touchLog.length + '</b>' +
    ' &nbsp; mouse <b>' + mouseLog.length + '</b>' +
    ' &nbsp; pointer <b>' + pointerLog.length + '</b>';
  document.getElementById('t').innerHTML = rows.map(function(r){
    return '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="p">' +
           (total ? (100*r[1]/total).toFixed(1) : '0') + '%</td></tr>';
  }).join('');
  document.getElementById('bar').textContent = 'tap intervals: ' + JSON.stringify(tapStats() || {});
}
function post(body){
  var url = ep.indexOf('ntfy:')===0 ? 'https://ntfy.sh/'+ep.slice(5) : ep;
  return fetch(url, {method:'POST', cache:'no-store', body:body}).catch(function(){});
}
function flushEvents(){
  ['touch','mouse','pointer'].forEach(function(kind){
    var fresh = pending[kind];
    if (!fresh.length) return;
    var fit = fresh.slice();
    var body = JSON.stringify({tag:tag, model:model, ua:navigator.userAgent, kind:kind, events:fit});
    while (fit.length > 1 && body.length > 3500){ fit.pop(); body = JSON.stringify({tag:tag, model:model, ua:navigator.userAgent, kind:kind, events:fit}); }
    pending[kind] = fresh.slice(fit.length);
    post(body);
  });
}
function report(){
  var p = profile();
  if (quiet) return;
  if (p.taps && p.taps !== sentTotal){
    sentTotal = p.taps;
    var summary = {tag:p.tag, model:p.model, ua:p.ua, taps:p.taps, buckets:p.buckets,
      radiusY:p.radiusY, touches:p.touches, forceMismatch:p.forceMismatch, tapIntervalMs:p.tapIntervalMs};
    post(JSON.stringify(summary));
  }
  flushEvents();
}
setInterval(report, 5000);
setInterval(render, 1000);
render();
</script>
</body></html>
