<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CollectLab · radius</title>
<style>
body{margin:0;font:13px -apple-system,system-ui;background:#0b0b0d;color:#e8e8ea}
header{position:sticky;top:0;background:#141418;border-bottom:1px solid #26262c;padding:8px;font-weight:600}
#sum{padding:10px;font-size:13px;line-height:1.6}
#sum b{color:#8ab4ff}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:4px 10px;border-bottom:1px solid #1c1c22}
td.n{color:#d6f5d6;text-align:right;width:70px}
td.p{color:#9a9aa5;text-align:right;width:70px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#141418;border-top:1px solid #26262c;padding:6px;font-size:11px;color:#9a9aa5}
</style>
<body>
<header>CollectLab · radius buckets</header>
<div style="padding:8px 10px;border-bottom:1px solid #26262c">
  <input id="model" placeholder="机型（如 iPhone 13）" style="width:60%;padding:6px;border-radius:6px;border:1px solid #333;background:#1d1d23;color:#e8e8ea">
  <button id="save" style="padding:6px 10px;border-radius:6px;border:1px solid #333;background:#1d1d23;color:#e8e8ea">save</button>
</div>
<div id="sum">tap the screen — radius buckets appear here</div>
<table id="t"></table>
<div class="bar" id="bar">waiting…</div>
<script>
var qs = new URLSearchParams(location.search);
var tag = qs.get('tag') || 'radius';
var ep = qs.get('ep') || 'ntfy:collectlab-7f3a91c2d4';
var quiet = qs.get('noreport') === '1';
var model = qs.get('model') || localStorage.getItem('collectlab.model') || '';
var modelInput = document.getElementById('model');
modelInput.value = model;
document.getElementById('save').onclick = function () {
  model = modelInput.value.trim();
  try { localStorage.setItem('collectlab.model', model); } catch (e) {}
  render();
};
var buckets = {}, total = 0, ry = {}, mismatch = 0, sent = 0;
function key(v){ return v == null ? 'null' : String(Math.round(v * 10000) / 10000); }
window.addEventListener('touchstart', function(e){
  var t = e.touches && e.touches[0];
  if (!t) return;
  total++;
  var k = key(t.radiusX);
  buckets[k] = (buckets[k] || 0) + 1;
  var y = key(t.radiusY);
  ry[y] = (ry[y] || 0) + 1;
  if (typeof t.force === 'number' && typeof t.radiusX === 'number' && Math.abs(t.force - t.radiusX) > 1e-6) mismatch++;
  render();
}, {passive:true, capture:true});
function render(){
  var rows = Object.keys(buckets).map(function(k){ return [k, buckets[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  document.getElementById('sum').innerHTML =
    'taps <b>' + total + '</b> &nbsp; distinct radiusX <b>' + rows.length + '</b>' +
    ' &nbsp; radiusY <b>' + (Object.keys(ry).join(',') || '-') + '</b>' +
    (mismatch ? ' &nbsp; force≠radiusX <b>' + mismatch + '</b>' : '');
  document.getElementById('t').innerHTML = rows.map(function(r){
    var pct = total ? (100 * r[1] / total).toFixed(1) : '0';
    return '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="p">' + pct + '%</td></tr>';
  }).join('');
  document.getElementById('bar').textContent = 'agent: ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 64);
}
function report(){
  if (quiet || !total || sent === total) return;
  sent = total;
  var payload = JSON.stringify({ tag: tag, model: model, ua: navigator.userAgent, taps: total,
                                 buckets: buckets, radiusY: ry, forceMismatch: mismatch });
  try {
    if (ep.indexOf('ntfy:') === 0) fetch('https://ntfy.sh/' + ep.slice(5), { method:'POST', cache:'no-store', body: payload }).catch(function(){});
    else fetch(ep, { method:'POST', cache:'no-store', body: payload }).catch(function(){});
  } catch (e) {}
}
setInterval(report, 5000);
render();
</script>
</body></html>
